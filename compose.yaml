services:
  app:
    build:
      context: .
    image: msc-de1-flask-app:local
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3