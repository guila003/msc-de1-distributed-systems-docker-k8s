apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flask-app-ingress
  namespace: msc-de1
spec:
  podSelector:
    matchLabels:
      app: flask-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000